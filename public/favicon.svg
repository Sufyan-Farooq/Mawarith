<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Obsidian background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0f0f0f"/>

  <!-- Subtle outer boundary ring -->
  <circle cx="16" cy="16" r="13" stroke="#d97706" stroke-width="0.6" stroke-dasharray="1.4 1.4" opacity="0.4"/>

  <!-- Rub el Hizb: first square -->
  <rect x="6.5" y="6.5" width="19" height="19" rx="1.5" stroke="#d97706" stroke-width="1.1" opacity="0.9"/>

  <!-- Rub el Hizb: second square rotated 45° -->
  <rect x="6.5" y="6.5" width="19" height="19" rx="1.5" stroke="#d97706" stroke-width="1.1" opacity="0.9" transform="rotate(45 16 16)"/>

  <!-- Division compass lines -->
  <line x1="16" y1="3.5" x2="16" y2="28.5" stroke="#d97706" stroke-width="0.6" opacity="0.45"/>
  <line x1="3.5" y1="16" x2="28.5" y2="16" stroke="#d97706" stroke-width="0.6" opacity="0.45"/>

  <!-- Central astrolabe hub — jade green -->
  <circle cx="16" cy="16" r="3" fill="#047857"/>
  <!-- Inner void -->
  <circle cx="16" cy="16" r="1.1" fill="#0f0f0f"/>
</svg>